<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#172033" stroke-width="1"/></pattern>
    <linearGradient id="usbar" x1="0" x2="1"><stop stop-color="#0369a1"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="cnbar" x1="0" x2="1"><stop stop-color="#9f1239"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 40px Arial,sans-serif;fill:#f8fafc}.sub{font:400 18px Arial,sans-serif;fill:#94a3b8}.panel{font:700 21px Arial,sans-serif;fill:#f8fafc}.label{font:700 16px Arial,sans-serif;fill:#e2e8f0}.value{font:700 31px Arial,sans-serif;fill:#fff}.note{font:400 14px Arial,sans-serif;fill:#cbd5e1}.tiny{font:400 12px Arial,sans-serif;fill:#94a3b8}.big{font:700 42px Arial,sans-serif;fill:#fbbf24}.quote{font:700 27px Arial,sans-serif;fill:#f8fafc}.source{font:400 11px Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#07101f"/><rect width="1600" height="900" fill="url(#grid)" opacity=".65"/>
  <circle cx="72" cy="65" r="9" fill="#fbbf24"/>
  <text x="96" y="77" class="title">La paradoja de 2026: superioridad material, brecha mínima</text>
  <text x="96" y="112" class="sub">Tres indicadores distintos; tres escalas separadas. La carrera no puede reducirse a un único ranking.</text>

  <!-- Panel 1 -->
  <rect x="70" y="160" width="460" height="485" rx="20" fill="#0f172a" stroke="#334155" filter="url(#shadow)"/>
  <text x="100" y="205" class="panel">MODELOS NOTABLES PUBLICADOS EN 2025</text>
  <text x="100" y="232" class="tiny">Conteo de Epoch AI citado por Stanford; no es censo de todos los modelos.</text>
  <text x="100" y="292" class="label">Estados Unidos</text>
  <rect x="100" y="313" width="354" height="54" rx="8" fill="url(#usbar)"/>
  <text x="470" y="351" text-anchor="end" class="value">59</text>
  <text x="100" y="422" class="label">China</text>
  <rect x="100" y="443" width="210" height="54" rx="8" fill="url(#cnbar)"/>
  <text x="326" y="481" text-anchor="end" class="value">35</text>
  <line x1="100" y1="540" x2="480" y2="540" stroke="#334155"/>
  <text x="100" y="573" class="note">EE. UU. produjo 1,69× más modelos notables.</text>
  <text x="100" y="602" class="note">Pero cantidad no equivale a distancia de capacidad.</text>

  <!-- Panel 2 -->
  <rect x="570" y="160" width="460" height="485" rx="20" fill="#0f172a" stroke="#334155" filter="url(#shadow)"/>
  <text x="600" y="205" class="panel">INVERSIÓN PRIVADA EN IA · 2025</text>
  <text x="600" y="232" class="tiny">Stanford advierte que la cifra privada subestima fondos estatales chinos.</text>
  <text x="600" y="292" class="label">Estados Unidos</text>
  <rect x="600" y="313" width="354" height="54" rx="8" fill="url(#usbar)"/>
  <text x="970" y="351" text-anchor="end" class="value">US$285,9B</text>
  <text x="600" y="422" class="label">China</text>
  <rect x="600" y="443" width="15" height="54" rx="7" fill="url(#cnbar)"/>
  <text x="630" y="481" class="value">US$12,4B</text>
  <line x1="600" y1="540" x2="980" y2="540" stroke="#334155"/>
  <text x="600" y="573" class="note">La inversión privada registrada fue más de 23× mayor.</text>
  <text x="600" y="602" class="note">El poder financiero estadounidense sigue siendo abrumador.</text>

  <!-- Panel 3 -->
  <rect x="1070" y="160" width="460" height="485" rx="20" fill="#0f172a" stroke="#334155" filter="url(#shadow)"/>
  <text x="1100" y="205" class="panel">BRECHA ENTRE LOS MEJORES MODELOS</text>
  <text x="1100" y="232" class="tiny">Arena Elo, preferencias humanas; no mide universalmente todas las tareas.</text>
  <text x="1100" y="294" class="label">Claude Opus 4.6 · EE. UU.</text>
  <rect x="1100" y="315" width="350" height="54" rx="8" fill="url(#usbar)"/>
  <text x="1464" y="352" text-anchor="end" class="value">1.503</text>
  <text x="1100" y="420" class="label">Dola-Seed-2.0 Preview · China</text>
  <rect x="1100" y="441" width="341" height="54" rx="8" fill="url(#cnbar)"/>
  <text x="1455" y="478" text-anchor="end" class="value">1.464</text>
  <line x1="1100" y1="535" x2="1480" y2="535" stroke="#334155"/>
  <text x="1100" y="572" class="big">2,7%</text>
  <text x="1198" y="570" class="note">ventaja relativa del líder estadounidense</text>
  <text x="1100" y="605" class="tiny">39 puntos Elo. Posiciones y brecha observadas en marzo de 2026.</text>

  <!-- Bottom thesis -->
  <rect x="70" y="690" width="1460" height="150" rx="20" fill="#261c08" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="732" class="label" fill="#fbbf24">LECTURA PARA LA CHARLA</text>
  <text x="110" y="778" class="quote">Estados Unidos tiene más capital y más infraestructura.</text>
  <text x="110" y="815" class="quote">China demostró que no necesita igualarlos para acercarse a la frontera.</text>
  <text x="1175" y="743" class="tiny">La pregunta cambia:</text>
  <text x="1175" y="773" class="label">¿ser primero?</text>
  <text x="1175" y="800" class="label">¿o ser suficientemente bueno,</text>
  <text x="1175" y="827" class="label">barato y desplegable?</text>

  <text x="70" y="878" class="source">Fuente: Stanford HAI, AI Index Report 2026 [20][21][22]. Cifras con metodologías y límites distintos; por eso se presentan en paneles separados.</text>
</svg>
